name: Star History

on:
  # Generate the chart as soon as this workflow is first added.
  push:
    branches: [main]
    paths:
      - .github/workflows/star-history.yml
  # Refresh quickly after a new star and reconcile unstars once a week.
  watch:
    types: [started]
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: xpzouying/star-history@8b1f26dc5e9a17caa75da9351b688509ef312811 # v1
        with:
          branch: star-history
