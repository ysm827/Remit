version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      vue-runtime:
        patterns: ["vue", "vue-router", "@vueuse/core"]
        update-types: [minor, patch]
      pinia:
        patterns: ["pinia", "pinia-plugin-persistedstate"]
        update-types: [minor, patch]
      vite:
        patterns: ["vite", "@vitejs/plugin-vue"]
        update-types: [minor, patch]
      typescript:
        patterns: ["typescript", "vue-tsc", "@vue/tsconfig", "@types/node"]
        update-types: [minor, patch]
      katex:
        patterns: ["katex", "@types/katex"]
        update-types: [minor, patch]
      marked:
        patterns: ["marked", "@types/marked"]
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
